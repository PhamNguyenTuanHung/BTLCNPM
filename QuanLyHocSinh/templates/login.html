<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="login-wrapper">

        <div class="system-logo">
            <div class="logo-circle">
                <i data-lucide="school"></i>
            </div>
            <h2>Hệ thống quản lý trường mầm non</h2>
        </div>

        {% if error %}
        <div
            style="background-color: #FEE2E2; color: #DC2626; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem;">
            {{ error }}
        </div>
        {% endif %}

        <div class="login-card">
            <form action="{{ url_for('login_process') }}" method="POST">
                <input type="text" name="username" placeholder="Tên đăng nhập" required>

                <input type="password" name="password" placeholder="Nhập mật khẩu" required>

                <div class="forgot-wrapper">
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                </div>
                <div class="role-picker">
                    <div class="role active" data-role="admin">
                        <i data-lucide="shield"></i> Quản trị viên
                    </div>
                    <div class="role" data-role="teacher">
                        <i data-lucide="book-open"></i> Giáo viên
                    </div>
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Role picker logic
        document.querySelectorAll(".role").forEach(r => {
            r.addEventListener("click", () => {
                document.querySelectorAll(".role").forEach(i => i.classList.remove("active"));
                r.classList.add("active");
            });
        });
    </script>
</body>

</html>
