<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo thống kê</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 20px; }
        h2, h3 { color: #333; }
        .stats-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-box { flex: 1; padding: 15px; border-radius: 8px; color: white; }
        .bg-rose { background-color: #F43F5E; }
        .bg-blue { background-color: #3B82F6; }
        .bg-yellow { background-color: #FACC15; }
        .charts-grid { display: flex; flex-direction: column; gap: 30px; }
        .chart-container { text-align: center; }
        .chart-container img { max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <header>
        <h2>Báo cáo thống kê</h2>
        <p>Filter: Lớp {{ filter_class_id or 'Tất cả' }}, Tháng {{ filter_month or 'Tất cả' }}, Năm {{ filter_year or 'Tất cả' }}</p>
    </header>

    <div class="stats-grid">
        <div class="stat-box bg-rose">
            <p>Tổng học sinh</p>
            <h3>{{ total_students }}</h3>
        </div>
        <div class="stat-box bg-blue">
            <p>Số lớp</p>
            <h3>{{ total_classes }}</h3>
        </div>
        <div class="stat-box bg-yellow">
            <p>Giáo viên</p>
            <h3>{{ total_teachers }}</h3>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <h3>Tỷ lệ nam/nữ</h3>
            <img src="data:image/png;base64,{{ charts.gender_chart }}" alt="Gender chart">
        </div>

        <div class="chart-container">
            <h3>Sĩ số theo lớp</h3>
            <img src="data:image/png;base64,{{ charts.class_chart }}" alt="Class size chart">
        </div>

        <div class="chart-container">
            <h3>Doanh thu theo tháng</h3>
            <img src="data:image/png;base64,{{ charts.revenue_chart }}" alt="Revenue chart">
        </div>
    </div>

</body>
</html>
